  <div class="wrap">
    <h1>地方政府單位預算 歲出計畫說明提要與各項費用明細表 解析工具</h1>
    
    <div class="warn">
      <strong>⚠ 本工具僅供輔助核對，不能取代人工審閱，一切數據以政府公布的預算書PDF原文為準。</strong><br>
      總工程費／總經費改以案別本年度金額旁的紫色ⓘ提示呈現，不另占資料列，也不納入本年度合計及四層驗算。
    </div>
    
    <div class="card">
      <div class="controls">
        <input type="file" id="f" accept=".pdf">
        <button class="btn-main" onclick="run()">解析</button>
        <span id="exportBtns" style="display:none">

        </span>
        <span id="msg"></span>
      </div>
      
      <div class="controls" style="margin-top:10px">
        <span class="small">沒有檔案？載入範例：</span>
        <button class="btn-sec" onclick="loadSample('taipei')">臺北市主計處 116年度</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';
    
    let _unitAgency = '', _rows = [], _issues = [], _repairs = [];
    let _agencyCheck = null;   // 工作計畫核對結果；null＝這份 PDF 沒有歲出機關別預算表
    
    if (typeof globalThis !== 'undefined') {
      globalThis.detectedAgency = () => _unitAgency;
    }
    
    const _ACCT = {
      '1000': '人事費', '1005': '民意代表待遇', '1010': '政務人員待遇', '1015': '法定編制人員待遇', 
      '1020': '約聘僱人員待遇', '1025': '技工及工友待遇', '1030': '獎金', '1035': '其他給與', 
      '1040': '加班費', '1045': '退休退職給付', '1050': '退休離職儲金', '1055': '保險', 
      '1060': '調待準備', '2000': '業務費', '2003': '教育訓練費', '2006': '水電費', 
      '2009': '通訊費', '2012': '土地租金', '2015': '權利使用費', '2018': '資訊服務費', 
      '2021': '其他業務租金', '2024': '稅捐及規費', '2027': '保險費', '2030': '兼職費', 
      '2033': '約用人員酬金', '2036': '按日按件計資酬金', '2039': '委辦費', '2042': '國際組織會費', 
      '2045': '國內組織會費', '2048': '軍事裝備及設施', '2051': '物品', '2054': '一般事務費', 
      '2057': '給養費', '2060': '軍事裝備設施養護費', '2063': '房屋建築養護費', '2066': '器具養護費', 
      '2069': '設施及機械設備養護費', '2072': '國內旅費', '2075': '大陸地區旅費', '2078': '國外旅費', 
      '2081': '運費', '2084': '短程車資', '2087': '機要費', '2090': '機密費', 
      '2093': '特別費', '3000': '設備及投資', '3005': '土地', '3010': '房屋建築及設備費', 
      '3015': '公共建設及設施費', '3020': '機械設備費', '3025': '運輸設備費', '3030': '資訊軟硬體設備費', 
      '3035': '雜項設備費', '3040': '權利', '3045': '投資', '4000': '獎補助費', 
      '4005': '對直轄市政府之補助', '4010': '對各縣市政府之補助', '4020': '地方政府對下級政府之補助', 
      '4025': '政府機關間之補助', '4030': '對特種基金之補助', '4035': '對外之捐助', '4040': '對國內團體之捐助', 
      '4045': '對私校之獎助', '4050': '對學生之獎助', '4055': '社會保險負擔', '4060': '對公保軍保退撫基金之補助及挹注', 
      '4065': '社會福利津貼及濟助', '4070': '公費就養及醫療補助', '4075': '差額補貼', '4080': '損失及賠償', 
      '4085': '獎勵及慰問', '4090': '其他補助及捐助', '5000': '債務費', '5005': '債務利息', 
      '5010': '手續費', '6000': '預備金', '6010': '第二預備金', '6015': '其他準備金'
    };
    
    const _strip = s => String(s || '').replace(/[\s ]/g, '');
    const _fmt = n => n === '' ? '' : (+n).toLocaleString('en-US');
    const _num = v => +String(v || '').replace(/,/g, '') || 0;
    
    function _groupRows(ws) {
      const rows = [];
      for (const w of ws) {
        let r = rows[rows.length - 1];
        if (!r || Math.abs(r.y - w.y) > 6) {
          r = { y: w.y, ws: [] };
          rows.push(r);
        }
        r.ws.push(w);
      }
      for (const r of rows) {
        r.ws.sort((a, b) => a.x - b.x);
      }
      return rows;
    }
    
    function _xOfChar(rws, idx) {
      let n = 0;
      for (const w of rws) {
        const len = _strip(w.s).length;
        if (idx < n + len) return w.x;
        n += len;
      }
      return null;
    }
    
    const _LOCAL_TITLE = '歲出計畫說明提要與各項費用明細表';
    const _COLS = ['name', 'unit', 'qty', 'price', 'amount', 'desc'];
    const _HEAD = {
      name: '分支計畫及用途別科目',
      unit: '單位',
      qty: '數量',
      price: '單價',
      amount: '預算數',
      desc: '說明'
    };
    
    function _localPageHead(ws) {
      const rows = _groupRows(ws);
      const texts = rows.map(r => _strip(r.ws.map(w => w.s).join('')));
      const ti = texts.findIndex(t => t.includes('用途別科目'));
      if (ti < 0) return null;
      
      const band = ws.filter(w => Math.abs(w.y - rows[ti].y) <= 12).sort((a, b) => a.x - b.x);
      const bt = _strip(band.map(w => w.s).join(''));
      const hx = {};
      
      for (const k of _COLS) {
        const at = bt.indexOf(_HEAD[k]);
        if (at >= 0) hx[k] = _xOfChar(band, at);
      }
      
      if (hx.name == null) {
        const at = bt.indexOf('用途別科目');
        if (at >= 0) hx.name = _xOfChar(band, at);
      }
      
      if (hx.name == null || hx.amount == null) return null;
      
      const bound = {};
      for (let i = 0; i < _COLS.length - 1; i++) {
        const a = hx[_COLS[i]];
        const b = hx[_COLS[i + 1]];
        if (a != null && b != null) {
          bound[_COLS[i]] = (a + b) / 2;
        }
      }
      
      const headY = Math.min(...band.map(w => w.y));
      const cnt = {};
      for (const w of ws) {
        if (w.y < headY - 2 && w.x > hx.amount && !/^[\d,]/.test(w.s.trim()) && _strip(w.s).length >= 2) {
          cnt[Math.round(w.x)] = (cnt[Math.round(w.x)] || 0) + 1;
        }
      }
      
      const mode = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
      if (mode && mode[1] >= 3) {
        bound.amount = +mode[0] - 2;
      }
      
      const single = {};
      for (const w of ws) {
        if (w.s.trim().length === 1 && w.y < headY - 2) {
          const k = Math.round(w.x);
          single[k] = (single[k] || 0) + 1;
        }
      }
      
      const stacks = Object.entries(single).filter(([, c]) => c >= 5).map(([x]) => +x);
      const ls = stacks.filter(x => x < hx.name);
      const rs = stacks.filter(x => hx.desc != null && x > hx.desc);
      
      return {
        hx,
        bound,
        headY,
        // 偵測不到側標時不可用表頭位置回推左界：續頁欄名只寫「用途別科目」（x=84），
        // 推出的界線 56 會把 x=35 的科目代碼整欄濾掉，該頁科目與明細全數退化成
        //「計畫說明」（實測新北社會局 p165 第一預備金、p331 一般建築及設備）。
        // left 的唯一職責是擋直書側標，沒偵測到側標就沒有要擋的東西。
        left: ls.length ? Math.max(...ls) + 6 : -Infinity,
        right: rs.length ? Math.min(...rs) - 6 : Infinity
      };
    }
    
    function _localLines(ws, head) {
      const { bound, left, headY } = head;
      const colOf = x => {
        for (let i = 0; i < _COLS.length - 1; i++) {
          if (x < bound[_COLS[i]]) return _COLS[i];
        }
        return 'desc';
      };
      
      const out = [];
      for (const r of _groupRows(ws)) {
        if (r.y >= headY - 2) continue;
        const cell = { name: [], unit: [], qty: [], price: [], amount: [], desc: [] };
        
        for (const w of r.ws) {
          if (w.x < left || w.x > head.right) continue;
          const raw = w.s.trim();
          if (/^[0-9a-z][0-9a-z-]{2,8}\s*[-–]\s*\d{1,3}$/i.test(raw)) continue;
          
          const c = colOf(w.x);
          
          if (c === 'amount') {
            const glued = raw.match(/^(-?\d{1,3}(?:,\d{3})+)(0[1-9]|[1-9]\d)([-–].+)$/);
            if (glued) {
              cell.amount.push(glued[1]);
              cell.desc.push(glued[2] + glued[3]);
              continue;
            }
          }
          
          if (c === 'amount' && /^(0[1-9]|[1-9]\d)$/.test(raw) && cell.amount.length > 0) {
            cell.desc.push(raw);
            continue;
          }
          if (c === 'amount' && /^\d{1,2}\./.test(raw)) {
            cell.desc.push(raw);
            continue;
          }
          if (c === 'amount' && /^\d{5,}/.test(raw) && !raw.includes(',')) {
            cell.desc.push(raw);
            continue;
          }
          
          const sp = c === 'amount' && (raw.match(/^([\d,]+)[\s ]+(.+)$/s) || raw.match(/^([\d,]+)([^\d\s,].*)$/s));
          if (sp) {
            cell.amount.push(sp[1]);
            cell.desc.push(sp[2]);
            continue;
          }
          
          cell[c].push(w.s);
        }
        
        const j = a => a.join('').trim();
        if (!cell.unit.length && !cell.qty.length && !cell.price.length && /^[-–]/.test(j(cell.desc))) {
          const fixed = j(cell.amount).match(/^(-?\d{1,3}(?:,\d{3})+)(0[1-9]|[1-9]\d)$/);
          if (fixed) {
            cell.amount = [fixed[1]];
            cell.desc.unshift(fixed[2]);
          }
        }
        
        if (!cell.unit.length && !cell.qty.length && !cell.price.length && /^\d{1,2}$/.test(j(cell.amount)) && /^[.、]/.test(j(cell.desc))) {
          cell.desc.unshift(j(cell.amount));
          cell.amount = [];
        }
        
        const line = { y: r.y };
        for (const k of _COLS) line[k] = j(cell[k]);
        if (_COLS.some(k => line[k])) out.push(line);
      }
      return out;
    }
    
    const _LOCAL_NUM = /^-?[\d,]+$/;
    // 11 碼數字，或統籌支撥的「8970a010401」（第 5 碼為英文字母）。
    // 不接受「10 碼數字＋字尾字母」——那是公文字號（1140761123A）的形狀。
    const _PLAN_CODE = /\b(?:\d{11}|\d{4}[a-z]\d{6})\b/i;
    // 計畫表頭帶：「業務計畫及工作計畫」或「名稱與編號」標籤列上下 16pt 之內。
    function _planHeaderBand(ws, rows, texts) {
      const ys = texts.map((t, i) => /業務計畫及工作計畫|名稱與編號/.test(t) ? rows[i].y : null)
        .filter(y => y !== null);
      return ys.length ? ws.filter(w => ys.some(y => Math.abs(w.y - y) <= 16)) : [];
    }

    function _localRow(plan, br, ln, level) {
      return {
        planCode: plan.code,
        planName: plan.name,
        planBudget: plan.budget,
        branchCode: br ? br.code : '',
        branchName: br ? br.name : '',
        l1Code: '',
        l1Name: '',
        l2Code: '',
        l2Name: '',
        level,
        amount: _LOCAL_NUM.test(ln.amount) ? ln.amount.replace(/,/g, '') : '',
        unit: ln.unit,
        qty: ln.qty,
        price: String(ln.price || '').replace(/,/g, ''),
        desc: ln.desc,
        page: ln.page || '',
        excluded: level === '總經費'
      };
    }
    
    function _isTotalCostText(s) {
      return /(總工程費|總經費)(?:明細)?如下|總工程費\s*[（(]?或[）)]?\s*總經費/.test(_strip(s));
    }
    
    function _attachTotalCostTooltips(rows) {
      let currentCase = null;
      for (const r of rows) {
        if (r.level === '案別') {
          currentCase = r;
          currentCase.totalCostItems = [];
          continue;
        }
        if (r.level === '分支計畫' || r.level === '計畫說明') {
          currentCase = null;
          continue;
        }
        if (r.level !== '總經費' || !currentCase) continue;
        
        const amount = _num(r.amount);
        const text = (r.desc || '').trim();
        const key = `${amount}|${text}`;
        if (!currentCase.totalCostItems.some(x => x.key === key)) {
          currentCase.totalCostItems.push({
            key, amount, text, unit: r.unit || '', qty: r.qty || '', price: _num(r.price)
          });
        }
      }
      
      for (const r of rows) {
        if (!r.totalCostItems?.length) continue;
        const amounts = [...new Set(r.totalCostItems.map(x => x.amount).filter(Boolean))];
        r.totalCostAmount = amounts.length ? Math.max(...amounts) : 0;
        const lines = [];
        if (r.totalCostAmount) {
          lines.push(`全期總工程費／總經費：${_fmt(r.totalCostAmount)}元`);
        }
        
        for (const x of r.totalCostItems) {
          if (!x.unit && !x.qty && !x.price && (!x.text || /總工程費|總經費/.test(x.text))) continue;
          // 說明原文多以句號結尾，直接接「：」會變成「規劃設計費。：29,980,000元」
          const label = (x.text || '總經費組成').replace(/[。，、：；．]+$/, '');
          const value = x.amount || x.price;
          const line = value ? `${label}：${_fmt(value)}元` : label;
          if (!lines.includes(line)) lines.push(line);
        }
        lines.push('此金額僅供查閱，不納入本年度明細合計及四層驗算。');
        r.totalCostTooltip = lines.join('\n');
      }
      return rows;
    }
    
    // ===== 歲出機關別預算表：工作計畫的獨立對照來源 =====
    // 四層加總驗算是自我一致性檢查——最頂端的工作計畫預算數就取自概況表自己的表頭，
    // 整條鏈沒有外部依據。同一本預算書的「歲出機關別預算表」以款項目節列出相同的工作計畫
    // 編號、名稱與本年度預算數（千元），拿它當外部基準才驗得到那個頂端數字。
    // 臺北市把表名印成「歲出預算表」，故用 regex 而非固定字串。
    const _AGENCY_TITLE_RE = /歲出(機關別)?預算表/;

    async function parseAgencyPlanTable(pdf, onProgress) {
      const map = new Map();
      let pages = 0;
      for (let i = 1; i <= pdf.numPages; i++) {
        if (onProgress) onProgress(i, pdf.numPages);
        const tc = await (await pdf.getPage(i)).getTextContent();
        const flat = tc.items.map(t => t.str).join('').replace(/[\s　]/g, '');
        if (!_AGENCY_TITLE_RE.test(flat)) continue;
        if (/目\s*次|第\d+頁至第/.test(flat)) continue;   // 目次頁也含表名，但沒有資料列
        pages++;
        const ws = tc.items.map(t => ({ x: t.transform[4], y: t.transform[5], s: t.str })).filter(w => w.s.trim());
        const lines = [];
        for (const w of ws.sort((a, b) => b.y - a.y)) {
          const g = lines[lines.length - 1];
          if (g && Math.abs(g.y - w.y) <= 3) g.w.push(w); else lines.push({ y: w.y, w: [w] });
        }
        lines.forEach(l => l.w.sort((a, b) => a.x - b.x));
        // 「本年度預算數」欄 x（表頭「本年度」出現兩次：預算數欄與比較欄，取靠左者）
        const hd = lines.flatMap(l => l.w).filter(w => w.s.replace(/[\s　]/g, '').startsWith('本年度'));
        const xB = hd.length ? Math.min(...hd.map(w => w.x)) : null;
        // PDFium 會把同一列的三個年度金額併成一個 item（"734,852 655,558 499,706 "），
        // 依空白拆開後第一段＝本年度預算數（欄序為 本年度／上年度／前年度）
        // 只取「開頭連續」的數字：金額後面常黏著說明欄文字，被寫進同一個 item
        //（實測新北 8970a040201「2,700,000 2,440,000 2,418,805 260,000 1.1.本年度預算數較…」），
        // 原本要求整段純數字，這種列的金額就整筆抽不到。
        const numParts = w => {
            const out = [];
            for (const t of w.s.trim().split(/\s+/)) {
                if (/^-?[\d,]+$/.test(t)) out.push(t); else break;
            }
            return out;
        };
        const isNum = w => numParts(w).length > 0;
        // 款項目節的層級號有時與代碼黏成同一個 item（高雄「01 　　　32020110101」），
        // 取最後一段空白分隔的 token 才拿得到代碼本身
        // 代碼可能是純數字（中央 10 碼、地方 11 碼）或地方的含字母式（8970a010401）。
        // 早期只認純數字，害 7 個含字母的工作計畫被判成「不在該表」——它們其實就在表裡。
        const _isCode = t => /^(?:\d{10,11}|\d{4}[a-z]\d{6})$/i.test(t);
        const _WELL_FORMED_AMT = /^-?\d{1,3}(?:,\d{3})*$/;
        const _toks = w => w.s.trim().split(/\s+/).map(t => t.replace(/[\s　]/g, '')).filter(Boolean);
        // 同頁乾淨可辨的代碼有多長，就用那個長度去拆「代碼與金額黏在一起」的 token。
        // 不能寫死（中央 10 碼、地方 11 碼），也不能猜——「6311110020126,812,015」切 10 碼或
        // 11 碼，剩下的都是合法的千分位數字（126,812,015／26,812,015），只有同頁其他列能定案。
        const _lens = {};
        for (const l of lines) for (const w of l.w) for (const t of _toks(w)) if (_isCode(t)) _lens[t.length] = (_lens[t.length] || 0) + 1;
        const codeLen = +(Object.keys(_lens).sort((a, b) => _lens[b] - _lens[a])[0] || 0);
        // 代碼不一定是 item 的最後一段：整列有時被塞進同一個 item
        //（實測新北社會局「01 　　　6311110020126,812,015 25,018,794 …」，最後一段是比較欄）。
        // 故掃過每個 token；找到代碼後，緊黏其後或緊接的下一段就是本年度預算數。
        const codeInfo = w => {
          const toks = _toks(w);
          for (let i = 0; i < toks.length; i++) {
            const t = toks[i];
            let code = null, amt = '';
            if (_isCode(t)) code = t;
            else if (codeLen && t.length > codeLen) {
              const head = t.slice(0, codeLen), rest = t.slice(codeLen);
              if (_isCode(head) && _WELL_FORMED_AMT.test(rest)) { code = head; amt = rest; }
            }
            if (!code) continue;
            if (!amt && toks[i + 1] && _WELL_FORMED_AMT.test(toks[i + 1])) amt = toks[i + 1];
            return { code, amt };
          }
          return null;
        };
        const codeOf = w => { const i = codeInfo(w); return i ? i.code : null; };
        const uniq = a => [...new Map(a.map(w => [Math.round(w.x) + '|' + w.s, w])).values()];
        for (let k = 0; k < lines.length; k++) {
          const cw = lines[k].w.find(w => codeOf(w) && (xB == null || w.x < xB - 10));
          if (!cw) continue;
          const code = codeOf(cw), codeX = cw.x;
          const nameCol = w => !isNum(w) && !codeOf(w) && w.x > codeX - 25 && w.x < (xB ?? 170) - 10;
          const amtOf = l => {
            // 代碼本身也是一長串數字，不排掉會被當成金額（中央版代碼獨佔一行時，
          // 金額欄就抓到代碼，實測衛福部整份 21 個計畫全錯）
          const n = l.w.filter(w => isNum(w) && !codeOf(w) && w.x >= codeX - 5);
            return (xB != null && n.find(w => Math.abs(w.x - xB) < 45)) || n[0];
          };
          // 版面有兩種：代碼與金額同一列、名稱在下一列（地方版），
          // 或代碼獨佔一列、名稱與金額都在下一列（中央版）。兩種都吃。
          // 代碼那一段自帶金額時優先採用：整列擠在同一個 item 時，x 座標切不出欄位
          const inline = codeInfo(cw).amt;
          let b = (inline ? { s: inline, x: codeX } : null) || amtOf(lines[k]);
          let name = uniq(lines[k].w.filter(nameCol)).map(w => w.s).join('').replace(/[\s　]/g, '');
          let start = k + 1;
          if (!b && lines[k + 1]) b = amtOf(lines[k + 1]);
          if (!name && lines[k + 1]) {
            name = uniq(lines[k + 1].w.filter(nameCol)).map(w => w.s).join('').replace(/[\s　]/g, '');
            start = k + 2;
          }
          // 名稱欄寬不夠時折到後續行（「新北市政府家庭暴」→「力暨性侵害防治中」→「心」）
          for (let j = start; j < lines.length; j++) {
            if (lines[j].w.some(w => codeOf(w)) || lines[j].w.some(w => isNum(w) && !codeOf(w) && w.x >= codeX - 5)) break;
            const c = uniq(lines[j].w.filter(nameCol)).map(w => w.s).join('').replace(/[\s　]/g, '');
            if (!c) break;
            name += c;
          }
          if (!map.has(code)) map.set(code, { name, budget: numParts(b || { s: '' })[0] || '' });
        }
      }
      return { map, pages };
    }

    function _planNameKey(s) { return (s || '').replace(/[\s　,，、。．.\-－–—‧･·()（）]/g, ''); }

    // 包含關係「有方向」，意義相反，不可混為一談：
    //   機關別表名稱 ⊂ 概況表名稱 → 機關別表被欄寬截斷，正常
    //   概況表名稱 ⊂ 機關別表名稱 → 概況表這側名稱不完整＝解析漏字，要報出來
    // 臺中市實測抓到 3 筆（「導執行」應為「總預算編審與督導執行」），對稱規則會放過。
    function _planNameIssue(agencyName, planName) {
      const x = _planNameKey(agencyName), y = _planNameKey(planName);
      if (!x) return 'noname';
      if (x === y) return '';
      if (y.includes(x)) return '';
      if (x.includes(y)) return 'short';
      return 'diff';
    }

    // 概況表的工作計畫 vs 機關別表。回傳 { total, checked, unmatched, noName, issues }。
    // 刻意「不」把『概況表有、機關別表沒有』當成錯誤：新北市有 7 個代碼含字母的計畫
    // （8970a010401 等）屬另一款別，本來就不列在這張表裡，報成不符全是假警報。
    // 但也不能當成沒事——那些計畫的金額就是「沒有第二個來源可驗」，必須明講，
    // 否則使用者會把「核對通過」誤讀成全部都驗過了。故獨立回傳 unmatched 供畫面提醒。
    function crossCheckAgencyPlans(rows, agency) {
      const plans = new Map();
      for (const r of rows) if (r.planCode && !plans.has(r.planCode)) plans.set(r.planCode, { name: r.planName, budget: r.planBudget });
      const issues = [], unmatched = [], nameUnverified = [], budgetUnverified = [];
      let checked = 0, noName = 0;
      for (const [code, p] of plans) {
        const a = agency.map.get(code);
        if (!a) { unmatched.push({ code, name: p.name, budget: p.budget }); continue; }
        checked++;
        // 概況表的 planBudget 單位是元，機關別表是千元
        const av = a.budget ? parseInt(a.budget.replace(/,/g, ''), 10) * 1000 : null;
        // 抽不到金額≠兩表有差異，是本工具沒讀到。報成「不符」等於誣賴預算書，
        // 故與 unmatched 同類處理：講明「無法核對」，不列進不符數。
        if (av === null) budgetUnverified.push({ code, name: p.name, budget: p.budget });
        else if (av !== +p.budget) issues.push({ code, kind: '本年度預算數不符', plan: p.name, a: _fmt(av), b: _fmt(+p.budget) });
        const ni = _planNameIssue(a.name, p.name);
        if (ni === 'noname') { noName++; nameUnverified.push({ code, name: p.name }); }
        else if (ni === 'short') issues.push({ code, kind: '本表名稱不完整', plan: p.name, a: a.name, b: p.name });
        else if (ni) issues.push({ code, kind: '名稱對不上', plan: p.name, a: a.name, b: p.name });
      }
      return { total: plans.size, checked, noName, issues, unmatched, nameUnverified, budgetUnverified };
    }

    async function parseLocalDoc(pdf, onProgress) {
      const out = [];
      let plan = null, br = null, l1 = null, acct = null, totalMode = false;
      _unitAgency = '';
      
      for (let i = 1; i <= pdf.numPages; i++) {
        if (onProgress) onProgress(i, pdf.numPages);
        const tc = await (await pdf.getPage(i)).getTextContent();
        const flat = tc.items.map(it => it.str).join('').replace(/[\s ]/g, '');
        if (!flat.includes(_LOCAL_TITLE) || flat.includes('目次')) continue;
        
        const ws = tc.items.map(it => ({
          x: it.transform[4],
          y: it.transform[5],
          s: it.str
        })).filter(w => w.s.trim()).sort((a, b) => b.y - a.y);
        
        const rows0 = _groupRows(ws);
        const texts0 = rows0.map(r => _strip(r.ws.map(w => w.s).join('')));
        
        if (!_unitAgency) {
          const bi = texts0.findIndex(t => t.includes(_LOCAL_TITLE));
          if (bi > 0 && /^[一-鿿－]{2,30}$/.test(texts0[bi - 1])) {
            _unitAgency = texts0[bi - 1];
          }
        }
        
        // 工作計畫代碼只能在「業務計畫及工作計畫／名稱與編號」表頭帶內撈：從整頁任意
        // run 撈 11 碼，說明欄的公文字號（新北社會局「1140761123A」「1130401415H」）
        // 會被當成新計畫，其後數十頁明細連同 br/l1/acct 全部改掛假計畫。
        // 續頁沒有計畫表頭 → 找不到代碼 → 沿用上一頁的 plan（本來就是這個行為）。
        const pcw = _planHeaderBand(ws, rows0, texts0).find(w => _PLAN_CODE.test(w.s));
        const pcode = pcw && pcw.s.match(_PLAN_CODE)[0];
        
        if (pcode && plan && plan.code === pcode) {
          const bm2 = _strip(ws.filter(w => w.x > pcw.x + 250).map(w => w.s).join('')).match(/([\d,]+)(千元|元)/);
          if (bm2) plan.budget = String(_num(plan.budget) + _num(bm2[1]) * (bm2[2] === '千元' ? 1000 : 1));
        }
        
        if (pcode && (!plan || plan.code !== pcode)) {
          // 計畫名稱有兩種版面，靠「代碼是不是自成一個 item」分流：
          //
          // (A) 代碼與欄位標籤黏在一起（新北：`業務計畫及工作計畫62111100101`）
          //     → 名稱就在「名稱與編號」那一行、標籤右側，且是完整的一段。
          //
          // (B) 代碼自成一個 item、獨佔一行（臺中、臺北社會局）
          //     → 名稱在代碼「正下方」、與代碼同一個 x，且欄寬不夠時會折成多段：
          //         y=724 x=149 「32020040701」
          //         y=712 x=149 「歲計會計業務-總預算編審與督」
          //         y=698 x=149 「導執行」
          //         y=670 x=149 「1.編審總預算…」   ← 計畫內容，名稱到此為止
          //     原本此路只取第一段，實測臺中 3、新北社會局 2、臺北社會局 1 筆被截斷
          //     （「導執行」應為「歲計會計業務-總預算編審與督導執行」）。
          //
          // 分流條件不可省：(B) 的收集邏輯套到 (A) 上會一路吃進表格內文
          //（實測收出「歲出計畫說明合計01人員維持費1000 人事費…」）。
          const _NAME_STOP = /^\s*(?:[\d０-９]+[.、．]|[一二三四五六七八九十]+[、.．])/;
          const codeAlone = /^\s*(?:\d{10,11}|\d{4}[a-z]\d{6})\s*$/i.test(pcw.s);
          // 名稱的第一段常被 pdf 與「業務計畫及工作計畫」標籤寫成同一個 item：
          //   y=714 x=38  「業務計畫及工作計畫對鄉（鎮、市、直轄市山地原住民」
          //   y=702 x=133 「區）之各項補助-對鄉（鎮、市、」
          //   y=690 x=133 「直轄市山地原住民區）之各項補助」
          // 只收 x 對齊代碼的那幾段會掉頭（實測新北 8970a010401 變成「區）之各項補助-…」）。
          const _LAB = '業務計畫及工作計畫';
          let head = '';
          const labW = ws.find(w => _strip(w.s).startsWith(_LAB));
          if (labW) {
            const rest = _strip(labW.s).slice(_LAB.length);
            // 標籤後面接的若是代碼本身（新北「業務計畫及工作計畫62111100101」）就不是名稱
            if (rest && /[一-鿿]/.test(rest) && !_PLAN_CODE.test(rest)) head = rest;
          }
          // 名稱區塊的下界＝「一、計畫內容／項目內容」那一行。只靠「條列標號開頭」擋不住：
          // 計畫內容的句子換行後，續行沒有標號且剛好也對齊名稱欄，會被一路吃進來
          //（實測新北 8970a010401 收出「…各項補助勢族群基本生活權利及改善環境衛生。」）。
          const _CONTENT_LAB = /^[一二三四五六七八九十]\s*[、.．]\s*(計畫|項目)內容/;
          const stopW = ws.filter(w => w.y < pcw.y && _CONTENT_LAB.test(_strip(w.s)))
            .sort((a, b) => b.y - a.y)[0];
          const yStop = stopW ? stopW.y : -Infinity;
          let name = head;
          if (codeAlone) {
            for (const w of ws.filter(w => Math.abs(w.x - pcw.x) < 6 && w.y < pcw.y - 2 && w.y > yStop && w.s.trim())
              .sort((a, b) => b.y - a.y)) {
              const t = w.s.trim();
              if (_NAME_STOP.test(t) || !/[一-鿿]/.test(t)) break;
              name += t;
            }
          }
          if (!name) {
            const ni = texts0.findIndex(t => t.includes('名稱與編號'));
            if (ni >= 0) {
              const lab = rows0[ni].ws.find(w => _strip(w.s).includes('名稱與編號')) || rows0[ni].ws[0];
              const cand = rows0[ni].ws.filter(w => w.x > lab.x + 10 && /[一-鿿]/.test(w.s)).sort((a, b) => a.x - b.x)[0];
              if (cand) name = cand.s.trim();
            }
          }
          if (!name) {
            const below = ws.filter(w => Math.abs(w.x - pcw.x) < 6 && w.y < pcw.y - 2).sort((a, b) => b.y - a.y)[0];
            name = below ? below.s.trim() : '';
          }
          const bm = _strip(ws.filter(w => w.x > pcw.x + 250).map(w => w.s).join('')).match(/([\d,]+)(千元|元)/);
          plan = { code: pcode, name, budget: bm ? String(_num(bm[1]) * (bm[2] === '千元' ? 1000 : 1)) : '' };
          br = null;
          l1 = null;
          acct = null;
          totalMode = false;
        }
        
        const head = _localPageHead(ws);
        if (!head || !plan) continue;
        
        for (const base of _localLines(ws, head)) {
          const ln = { ...base, page: i };
          const nm = ln.name;
          const bm = nm.match(/^(\d{2})(?!\d)[\s ]*([^\d\s].*)$/);
          const am = nm.match(/^(\d{4})[\s ]+(.+)$/);
          
          if (_strip(nm) === '合計') {
            out.push(_localRow(plan, br, ln, '計畫說明'));
            totalMode = false;
            continue;
          }
          
          if (am) {
            totalMode = false;
            const code = am[1];
            const name = _ACCT[code] || am[2].trim();
            const row = _localRow(plan, br, ln, code.endsWith('000') ? '用途別一級' : '用途別二級');
            if (code.endsWith('000')) {
              l1 = { code, name };
              row.l1Code = code;
              row.l1Name = name;
            } else {
              row.l1Code = l1 ? l1.code : '';
              row.l1Name = l1 ? l1.name : '';
              row.l2Code = code;
              row.l2Name = name;
            }
            out.push(row);
            acct = row;
            continue;
          }
          
          if (bm) {
            totalMode = false;
            br = { code: bm[1], name: bm[2].trim() };
            out.push(_localRow(plan, br, ln, '分支計畫'));
            l1 = null;
            acct = null;
            continue;
          }
          
          // 案號與案名之間不一定有破折號：臺北主計處／社會局寫「03-113年個人電腦租賃費」，
          // 新工處寫「03115年度道路工程規劃設計」「10洲美快速道路…」。只認破折號時，
          // 案小計會被當成明細算進上一個科目（實測新工處 3 處明細≠科目，差額正是案小計）。
          // 仍要求左欄空白且無單位／數量／單價——實測七份樣本中，符合此形狀的列全是案別。
          if (!nm && ln.amount && !ln.unit && !ln.qty && !ln.price
            && /^\d{2}(?:[-–]|(?=\d{3}年度)|(?=[^\d]))/.test(ln.desc)) {
            totalMode = false;
            const row = _localRow(plan, br, ln, '案別');
            out.push(row);

          if (_isTotalCostText(ln.desc) || _isTotalCostText(nm)) {

          if (!nm && ln.amount && !ln.unit && !ln.qty && !ln.price && ln.desc && acct && _num(ln.amount) > _num(acct.amount)) {

      const _finalBudget = new Map();

    // 修正三：若同科目明細加總大於表列數，僅對「單價空白」且金額疑似與數量黏連的列，
    // 嘗試移除金額最左側 1~3 碼。只有找到唯一且可讓整組精確等於科目表列數的組合才採用。
    function _repairDetailAmounts(rows) {
      _repairs = [];
      let cur = null, details = [];
      
      const close = () => {
        if (!cur || !details.length) return;
        const target = _num(cur.amount);
        const sum = details.reduce((s, r) => s + _num(r.amount), 0);
        
        if (sum <= target) return;
        
        const candidates = details.map(r => {
          const raw = String(r.amount || '').replace(/^-/, '');
          const a = [_num(r.amount)];
          if (!r.price && raw.length >= 4) {
            for (let k = 1; k <= 3 && k < raw.length - 2; k++) {
              const v = +raw.slice(k);
              if (v >= 0 && v <= target && !a.includes(v)) a.push(v);
            }
          }
          return a;
        });
        
        let solution = null, count = 0;
        
        function dfs(idx, vals, total) {
          if (total > target) return;
          if (idx === details.length) {
            if (total === target) {
              solution = vals.slice();
              count++;
            }
            return;
          }
          for (const v of candidates[idx]) {
            vals.push(v);
            dfs(idx + 1, vals, total + v);
            vals.pop();
            if (count > 1) return;
          }
        }
        
        dfs(0, [], 0);
        
        if (count === 1 && solution) {
          details.forEach((r, i) => {
            const old = _num(r.amount);
            const now = solution[i];
            if (old !== now) {
              _repairs.push({
                page: r.page,
                plan: r.planName,
                branch: r.branchName,
                code: r.l2Code || r.l1Code,
                name: r.l2Name || r.l1Name,
                old,
                new: now,
                desc: r.desc
              });
              r.originalAmount = String(old);
              r.amount = String(now);
              r.repaired = true;
            }
          });
        }
      };
      
      for (const r of rows) {
        if (r.level === '明細') {
          details.push(r);
          continue;
        }
        close();
        details = [];
        cur = (r.level === '用途別一級' || r.level === '用途別二級') ? r : null;
      }
      close();
    }
    
    function reconcile(rows) {
      const bad = [];
      const n = _num;
      let cur = null, acc = 0, cnt = 0;
      
      const close = () => {
        if (cur && cnt && acc !== n(cur.amount)) {
          bad.push({
            type: '明細≠科目',
            plan: cur.planName,
            branch: cur.branchName,
            code: cur.l2Code || cur.l1Code,
            name: cur.l2Name || cur.l1Name,
            listed: n(cur.amount),
            sum: acc,
            diff: acc - n(cur.amount),
            page: cur.page
          });
        }
        acc = 0;
        cnt = 0;
      };
      
      for (const r of rows) {
        if (r.level === '明細' && !r.excluded) {
          acc += n(r.amount);
          cnt++;
          continue;
        }
        close();
        cur = (r.level === '用途別一級' || r.level === '用途別二級') ? r : null;
      }
      close();
      
      const k1 = r => [r.planCode, r.branchCode, r.l1Code].join('|');
      const l1 = new Map();
      for (const r of rows) {
        if (r.level === '用途別一級') {
          const g = l1.get(k1(r));
          if (g) g.a += n(r.amount);
          else l1.set(k1(r), { a: n(r.amount), s: 0, r });
        }
      }
      
      for (const r of rows) {
        if (r.level === '用途別二級') {
          const g = l1.get(k1(r));
          if (g) g.s += n(r.amount);
        }
      }
      
      // 不用 `g.s &&` 跳過 Σ=0：一級底下一個二級都沒有，本身就是解析失敗的徵兆
      for (const g of l1.values()) {
        if (g.s !== g.a) {
          bad.push({
            type: '二級≠一級',
            plan: g.r.planName,
            branch: g.r.branchName,
            code: g.r.l1Code,
            name: g.r.l1Name,
            listed: g.a,
            sum: g.s,
            diff: g.s - g.a,
            page: g.r.page
          });
        }
      }
      
      const k2 = r => [r.planCode, r.branchCode].join('|');
      const brs = new Map();
      for (const r of rows) {
        if (r.level === '分支計畫') {
          brs.set(k2(r), { a: n(r.amount), s: 0, r });
        }
      }
      
      for (const r of rows) {
        if (r.level === '用途別一級') {
          const g = brs.get(k2(r));
          if (g) g.s += n(r.amount);
        }
      }
      
      for (const g of brs.values()) {
        if (g.s !== g.a) {
          bad.push({
            type: '一級≠分支',
            plan: g.r.planName,
            branch: g.r.branchName,
            code: g.r.branchCode,
            name: g.r.branchName,
            listed: g.a,
            sum: g.s,
            diff: g.s - g.a,
            page: g.r.page
          });
        }
      }
      
      // 沒有分支層的計畫（第一預備金、一般建築及設備、統籌支撥各計畫，實測 18 個）
      // 改比 Σ一級——不能用 `g.s &&` 跳過，那會讓「整頁科目欄被誤濾成計畫說明」
      // 這類錯誤靜默通過（分支數 0 → Σ 0 → 不檢查）。
      const pl = new Map();
      for (const r of rows) {
        if (r.planBudget) {
          pl.set(r.planCode, { a: n(r.planBudget), s: 0, nb: 0, l1: 0, r });
        }
      }
      
      for (const r of rows) {
        const g = pl.get(r.planCode);
        if (!g) continue;
        if (r.level === '分支計畫') { g.s += n(r.amount); g.nb++; }
        else if (r.level === '用途別一級') g.l1 += n(r.amount);
      }
      
      for (const g of pl.values()) {
        if (!g.nb) g.s = g.l1;
        if (g.s !== g.a) {
          bad.push({
            type: g.nb ? '分支≠計畫' : '一級≠計畫',
            plan: g.r.planName,
            branch: '',
            code: g.r.planCode,
            name: g.r.planName,
            listed: g.a,
            sum: g.s,
            diff: g.s - g.a,
            page: g.r.page
          });
        }
      }
      
      return bad;
    }
    
    const _PDFIUM_CDN = 'https://cdn.jsdelivr.net/npm/@embedpdf/pdfium@2.14.4/dist/';
    let _pdfiumLib = null;
    
    async function _loadPdfium() {
      if (_pdfiumLib) return _pdfiumLib;
      const mod = await import(_PDFIUM_CDN + 'index.browser.js');
      _pdfiumLib = await mod.init({ locateFile: f => _PDFIUM_CDN + f });
      _pdfiumLib.PDFiumExt_Init();
      return _pdfiumLib;
    }
    
    function _pdfiumPageItems(lib, tp) {
      const M = lib.pdfium;
      const n = lib.FPDFText_CountChars(tp);
      const px = M._malloc(8);
      const py = M._malloc(8);
      const chars = [];
      
      for (let i = 0; i < n; i++) {
        const u = lib.FPDFText_GetUnicode(tp, i);
        lib.FPDFText_GetCharOrigin(tp, i, px, py);
        chars.push({
          c: String.fromCharCode(u),
          x: M.HEAPF64[px / 8],
          y: M.HEAPF64[py / 8]
        });
      }
      M._free(px);
      M._free(py);
      
      const rows = [];
      for (const ch of chars) {
        if (ch.c === '\r' || ch.c === '\n') continue;
        let r = rows.find(r0 => Math.abs(r0.y - ch.y) <= 2);
        if (!r) {
          r = { y: ch.y, cs: [] };
          rows.push(r);
        }
        r.cs.push(ch);
      }
      
      const items = [];
      for (const r of rows) {
        r.cs.sort((a, b) => a.x - b.x);
        let run = null;
        for (const ch of r.cs) {
          if (run && ch.x - run.end < 14) {
            run.str += ch.c;
            run.end = ch.x + 11;
          } else {
            run = {
              str: ch.c,
              transform: [0, 0, 0, 0, ch.x, r.y],
              end: ch.x + 11
            };
            items.push(run);
          }
        }
      }
      return items;
    }
    
    function _pdfiumFakeDoc(lib, data) {
      const M = lib.pdfium;
      const ptr = M._malloc(data.length);
      M.HEAPU8.set(data, ptr);
      const doc = lib.FPDF_LoadMemDocument(ptr, data.length, 0);
      if (!doc) {
        M._free(ptr);
        throw Error('PDFium 開檔失敗');
      }
      
      return {
        numPages: lib.FPDF_GetPageCount(doc),
        async getPage(no) {
          return {
            async getTextContent() {
              const page = lib.FPDF_LoadPage(doc, no - 1);
              const tp = lib.FPDFText_LoadPage(page);
              const items = _pdfiumPageItems(lib, tp);
              lib.FPDFText_ClosePage(tp);
              lib.FPDF_ClosePage(page);
              return { items };
            }
          };
        },
        destroy() {
          lib.FPDF_CloseDocument(doc);
          M._free(ptr);
        }
      };
    }

    async function _parse(data) {

      msg.textContent = '解析中…';
      try {

        _rows = await parseLocalDoc(pdf, (i, n) => msg.textContent = `解析中… ${i}/${n}`);
        let engine = 'pdf.js', doc = pdf, fake = null;

        if (!_rows.length) {
          msg.textContent = 'pdf.js 無法解讀，改用 PDFium…';
          const lib = await _loadPdfium();
          fake = _pdfiumFakeDoc(lib, data);

          doc = fake;
          engine = 'PDFium';
        }

        // 工作計畫核對要用「解析成功的那個引擎」的同一份 doc，故在 destroy 之前跑
        try {

            : { map: new Map(), pages: 0 };

        } finally {
          if (fake) fake.destroy();
        }

        if (!_rows.length) throw Error('找不到可解析的費用明細表');
        
        _filter.plan = _filter.branch = _filter.acct = _filter.level = _filter.q = '';
        document.getElementById('exportBtns').style.display = '';
        msg.textContent = `完成：${_rows.length} 列（機關：${_unitAgency || '未偵測'}｜引擎：${engine}｜自動修復：${_repairs.length}筆）`;

    if (typeof document.addEventListener === 'function') {

          const li = c.unmatched.map(x => `${esc(x.code)} ${esc(x.name)}：${_fmt(+x.budget)} 元`).join('<br>');
          reconLine += `<div class="recon bad" style="border-left-color:#fd7e14;background:#fff8f0;">`
            + `⚠ 有 ${c.unmatched.length} 個工作計畫在歲出機關別預算表中找不到對應編號，`
            + `<strong>這些計畫的本年度預算數未經外部核對</strong>，請自行回對 PDF：<br>${li}`
            + `<div class="small" style="margin-top:6px;">代碼含字母者（如 8970a010401）多屬另一款別，本就不列在該表，屬正常；`
            + `若是一般代碼卻找不到，較可能是本工具漏抓或該表解析不全。</div></div>`;
        }
        if (c.budgetUnverified.length) {
          reconLine += `<p class="note">⚠ 有 ${c.budgetUnverified.length} 個工作計畫在機關別預算表的本年度預算數欄抽不到數字，`
            + `<strong>金額未經核對</strong>：`
            + esc(c.budgetUnverified.map(x => `${x.code} ${x.name}`).join('、')) + '</p>';
        }
        if (c.nameUnverified.length) {
          reconLine += `<p class="note">⚠ 有 ${c.nameUnverified.length} 個工作計畫在機關別預算表的名稱欄抽不到文字，`
            + `<strong>名稱未經核對</strong>（金額仍有比對）：`
            + esc(c.nameUnverified.map(x => `${x.code} ${x.name}`).join('、')) + '</p>';
        }
      }

      if (_repairs.length) {
        reconLine += `<p class="note">ℹ 已自動修復 ${_repairs.length} 筆疑似欄位黏連金額；匯出資料會保留「原始預算數」供複核。</p>`;
      }
      
      const getOpts = (l, pick, vf, tf) => {
        const m = new Map();
        for (const r of _rows.filter(r => r.level !== '總經費' && _passUpTo(r, l))) {
          if (pick(r) && !m.has(vf(r))) m.set(vf(r), tf(r));
        }
        const opts = [...m].map(([v, t]) => ({ v, t }));
        if (_filter[l] && !opts.some(o => o.v === _filter[l])) _filter[l] = '';
        return opts;
      };
      
      const planOpts = getOpts('plan', r => r.planCode, r => r.planCode, r => `${r.planCode} ${r.planName}`);
      const brOpts = getOpts('branch', r => r.branchCode && r.branchName, r => r.branchName, r => r.branchName);
      const acctOpts = getOpts('acct', r => r.l1Code || r.l2Code, r => r.l2Code || r.l1Code, r => `${r.l2Code || r.l1Code} ${r.l2Name || r.l1Name}`);
      const levelOpts = getOpts('level', r => r.level, r => r.level, r => r.level);
      const F = _filter;
      
      const sel = (k, label, opts, cur) => `
        <label>${label}：
          <select onchange="_onFilter('${k}', this.value)">
            <option value="">全部</option>
            ${opts.map(o => `<option value="${esc(o.v)}"${o.v === cur ? ' selected' : ''}>${esc(o.t)}</option>`).join('')}
          </select>
        </label>`;
        
      const search = `<label>說明搜尋：<input value="${esc(F.q)}" placeholder="輸入關鍵字後按 Enter" oninput="_filter.q=this.value" onkeydown="if(event.key==='Enter')render()"></label>`;
      const clear = (F.plan || F.branch || F.acct || F.level || F.q) ? `<button class="btn-sec" onclick="_filter.plan=_filter.branch=_filter.acct=_filter.level=_filter.q='';render()" style="padding:5px 12px">清除</button>` : '';
      
      const filter = `<div class="filter-bar">${sel('plan', '工作計畫', planOpts, F.plan)}${sel('branch', '分支計畫', brOpts, F.branch)}${sel('acct', '用途別科目', acctOpts, F.acct)}${sel('level', '層級', levelOpts, F.level)}${search}${clear}</div>`;
      const view = _rows.filter(r => r.level !== '總經費' && _pass(r));
      const leaves = view.filter(r => r.level === '明細' && !r.excluded);
      const total = leaves.reduce((s, r) => s + _num(r.amount), 0);
      
      const totalRow = `<tr class="lv-total">
        <td colspan="9">合計（目前篩選：${leaves.length}筆本年度明細；總經費列不計）</td>
        <td class="num">${_fmt(total)}</td>
        <td></td>
      </tr>`;
      
      const body = view.map(r => `
        <tr class="${cls[r.level] || ''}">
          <td>${esc(r.planCode)}</td>
          <td>${esc(r.planName)}</td>
          <td>${esc(r.branchCode)}</td>
          <td>${esc(r.branchName)}</td>
          <td>${esc(r.l2Code || r.l1Code)}</td>
          <td>${esc(r.l2Name || r.l1Name)}</td>
          <td>${esc(r.unit)}</td>
          <td class="num">${esc(r.qty)}</td>
          <td class="num">${_fmt(r.price)}</td>
          <td class="num ${r.totalCostTooltip ? 'has-total-cost' : ''}"${r.totalCostTooltip || r.repaired ? ` data-tip="${esc(r.repaired ? '原始擷取：' + _fmt(r.originalAmount) : r.totalCostTooltip)}"` : ''}>
            ${_fmt(r.amount)}${r.repaired ? ' *' : ''}
            ${r.totalCostTooltip ? '<span class="total-tip">ⓘ</span>' : ''}
          </td>
          <td>${esc(r.desc)}</td>
        </tr>
      `).join('');
      
      document.getElementById('out').innerHTML = reconLine + filter + `
        <div class="tw">
          <table>
            <thead>
              <tr>
                <th>工作計畫編號</th>
                <th>工作計畫</th>
                <th>分支計畫編號</th>
                <th>分支計畫</th>
                <th>用途別科目代碼</th>
                <th>用途別科目</th>
                <th>單位</th>
                <th>數量</th>
                <th>單價</th>
                <th>預算數</th>
                <th>說明</th>
              </tr>
            </thead>
            <tbody>
              ${totalRow}
              ${body}
            </tbody>
          </table>
        </div>`;
        
      const tbl = document.querySelector('.tw table');
      if (tbl && tbl.tHead) {
        tbl.style.setProperty('--head-h', tbl.tHead.getBoundingClientRect().height + 'px');
      }
    }
    
    function _exportRows() {
      return _rows.filter(r => r.level !== '總經費' && _pass(r));
    }
    
    function exportData(kind) {
      if (!_rows.length) return;
      
      const head = ['工作計畫編號', '工作計畫', '分支計畫編號', '分支計畫', '用途別科目代碼', '用途別科目', '層級', '單位', '數量', '單價', '預算數', '原始預算數', '自動修復', '全期總經費', '總經費說明', 'PDF頁碼', '說明'];
      const view = _exportRows();
      const arr = r => [r.planCode, r.planName, r.branchCode, r.branchName, r.l2Code || r.l1Code, r.l2Name || r.l1Name, r.level, r.unit, r.qty, r.price, r.amount === '' ? '' : +r.amount, r.originalAmount ? +r.originalAmount : '', r.repaired ? '是' : '', r.totalCostAmount || '', r.totalCostTooltip || '', r.page, r.desc];
      const fname = '歲出計畫說明提要與各項費用明細表';
      
      if (kind === 'xlsx') {
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head, ...view.map(arr)]), '費用明細表');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(_issues), '驗算差異');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(_repairs), '自動修復');
        XLSX.writeFile(wb, fname + '.xlsx');
        return;
      }
      
      let content, mime;
      if (kind === 'csv') {
        const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
        content = '\ufeff' + [head, ...view.map(arr)].map(r => r.map(q).join(',')).join('\r\n');
        mime = 'text/csv;charset=utf-8';
      } else {
        content = JSON.stringify(view.map(r => Object.fromEntries(head.map((h, i) => [h, arr(r)[i]]))), null, 2);
        mime = 'application/json';
      }
      download(content, fname + '.' + kind, mime);
    }
    
    function exportIssues() {
      const head = ['類型', '工作計畫', '分支計畫', '代碼', '名稱', '表列數', '明細加總', '差異', 'PDF頁碼'];
      const arr = x => [x.type, x.plan, x.branch, x.code, x.name, x.listed, x.sum, x.diff, x.page];
      const wb = XLSX.utils.book_new();
      
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head, ..._issues.map(arr)]), '驗算差異');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(_repairs), '自動修復');
      XLSX.writeFile(wb, '歲出解析驗算差異.xlsx');
    }
    
    function download(content, name, type) {
      const a = document.createElement('a');
      const url = URL.createObjectURL(new Blob([content], { type }));
      a.href = url;
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  </script>
</body>
</html>
