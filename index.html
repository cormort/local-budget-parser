<head>

  <title>地方政府單位預算「歲出計畫說明提要與各項費用明細表」解析工具</title>
  <style>
    body {
      font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      margin: 0;
      background: #f5f7fa;
      color: #212529;
    }

    .wrap {
      max-width: 1400px;

    }

    h1 {
      color: #0d47a1;

    }

    .warn {
      background: #fff8e1;
      border: 1px solid #ffe082;

    .card {
      background: #fff;

    }

    .btn-sec {

      color: #fff;
    }

    .btn-exp {
      background: #28a745;
      color: #fff;
    }

    .ok {
      color: #155724;
    }

    .bad {

    }

    .note {
      color: #856404;
    }

    .tw {
      max-height: 70vh;

    .filter-bar {

      margin: 10px 0;

      border: 1px solid #dee2e6;

    .filter-bar label {
      margin-right: 14px;

    .filter-bar select,
    .filter-bar input {

<body>
  <div class="wrap">
    <h1>地方政府單位預算 歲出計畫說明提要與各項費用明細表 解析工具</h1>
    
    <div class="warn">
      <strong>⚠ 本工具僅供輔助核對，不能取代人工審閱，一切數據以政府公布的預算書PDF原文為準。</strong><br>
      總工程費／總經費改以案別本年度金額旁的紫色ⓘ提示呈現，不另占資料列，也不納入本年度合計及四層驗算。
    </div>
    
    <div class="card">
      <div class="controls">
        <input type="file" id="f" accept=".pdf">
        <button class="btn-main" onclick="run()">解析</button>
        <span id="exportBtns" style="display:none">
          <button class="btn-exp" onclick="exportData('xlsx')">匯出 xlsx</button>
          <button class="btn-exp" onclick="exportData('csv')">匯出 csv</button>
          <button class="btn-exp" onclick="exportData('json')">匯出 json</button>
          <button class="btn-exp" onclick="exportIssues()">匯出驗算差異</button>
        </span>
        <span id="msg"></span>
      </div>
      
      <div class="controls" style="margin-top:10px">
        <span class="small">沒有檔案？載入範例：</span>
        <button class="btn-sec" onclick="loadSample('taipei')">臺北市主計處 116年度</button>
        <button class="btn-sec" onclick="loadSample('taipeiSocial')">臺北市社會局 116年度</button>
        <button class="btn-sec" onclick="loadSample('taichung')">臺中市主計處 115年度</button>
        <button class="btn-sec" onclick="loadSample('kaohsiung')">高雄市主計處 115年度</button>
        <button class="btn-sec" onclick="loadSample('newtaipei')">新北市主計處 115年度</button>
        <button class="btn-sec" onclick="loadSample('newtaipeiSocial')">新北市社會局主管 115年度</button>
        <button class="btn-sec" onclick="loadSample('taipeiNewWorks')">臺北市新工處 116年度</button>
      </div>
      
      <div id="out"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';
    
    let _unitAgency = '', _rows = [], _issues = [], _repairs = [];
    
    if (typeof globalThis !== 'undefined') {
      globalThis.detectedAgency = () => _unitAgency;
    }
    
    const _ACCT = {
      '1000': '人事費', '1005': '民意代表待遇', '1010': '政務人員待遇', '1015': '法定編制人員待遇', 
      '1020': '約聘僱人員待遇', '1025': '技工及工友待遇', '1030': '獎金', '1035': '其他給與', 
      '1040': '加班費', '1045': '退休退職給付', '1050': '退休離職儲金', '1055': '保險', 
      '1060': '調待準備', '2000': '業務費', '2003': '教育訓練費', '2006': '水電費', 
      '2009': '通訊費', '2012': '土地租金', '2015': '權利使用費', '2018': '資訊服務費', 
      '2021': '其他業務租金', '2024': '稅捐及規費', '2027': '保險費', '2030': '兼職費', 
      '2033': '約用人員酬金', '2036': '按日按件計資酬金', '2039': '委辦費', '2042': '國際組織會費', 
      '2045': '國內組織會費', '2048': '軍事裝備及設施', '2051': '物品', '2054': '一般事務費', 
      '2057': '給養費', '2060': '軍事裝備設施養護費', '2063': '房屋建築養護費', '2066': '器具養護費', 
      '2069': '設施及機械設備養護費', '2072': '國內旅費', '2075': '大陸地區旅費', '2078': '國外旅費', 
      '2081': '運費', '2084': '短程車資', '2087': '機要費', '2090': '機密費', 
      '2093': '特別費', '3000': '設備及投資', '3005': '土地', '3010': '房屋建築及設備費', 
      '3015': '公共建設及設施費', '3020': '機械設備費', '3025': '運輸設備費', '3030': '資訊軟硬體設備費', 
      '3035': '雜項設備費', '3040': '權利', '3045': '投資', '4000': '獎補助費', 
      '4005': '對直轄市政府之補助', '4010': '對各縣市政府之補助', '4020': '地方政府對下級政府之補助', 
      '4025': '政府機關間之補助', '4030': '對特種基金之補助', '4035': '對外之捐助', '4040': '對國內團體之捐助', 
      '4045': '對私校之獎助', '4050': '對學生之獎助', '4055': '社會保險負擔', '4060': '對公保軍保退撫基金之補助及挹注', 
      '4065': '社會福利津貼及濟助', '4070': '公費就養及醫療補助', '4075': '差額補貼', '4080': '損失及賠償', 
      '4085': '獎勵及慰問', '4090': '其他補助及捐助', '5000': '債務費', '5005': '債務利息', 
      '5010': '手續費', '6000': '預備金', '6010': '第二預備金', '6015': '其他準備金'
    };
    
    const _strip = s => String(s || '').replace(/[\s ]/g, '');
    const _fmt = n => n === '' ? '' : (+n).toLocaleString('en-US');
    const _num = v => +String(v || '').replace(/,/g, '') || 0;
    
    function _groupRows(ws) {
      const rows = [];
      for (const w of ws) {
        let r = rows[rows.length - 1];
        if (!r || Math.abs(r.y - w.y) > 6) {
          r = { y: w.y, ws: [] };
          rows.push(r);
        }
        r.ws.push(w);
      }
      for (const r of rows) {
        r.ws.sort((a, b) => a.x - b.x);
      }
      return rows;
    }
    
    function _xOfChar(rws, idx) {
      let n = 0;
      for (const w of rws) {
        const len = _strip(w.s).length;
        if (idx < n + len) return w.x;
        n += len;
      }
      return null;
    }
    
    const _LOCAL_TITLE = '歲出計畫說明提要與各項費用明細表';
    const _COLS = ['name', 'unit', 'qty', 'price', 'amount', 'desc'];
    const _HEAD = {
      name: '分支計畫及用途別科目',
      unit: '單位',
      qty: '數量',
      price: '單價',
      amount: '預算數',
      desc: '說明'
    };
    
    function _localPageHead(ws) {
      const rows = _groupRows(ws);
      const texts = rows.map(r => _strip(r.ws.map(w => w.s).join('')));
      const ti = texts.findIndex(t => t.includes('用途別科目'));
      if (ti < 0) return null;
      
      const band = ws.filter(w => Math.abs(w.y - rows[ti].y) <= 12).sort((a, b) => a.x - b.x);
      const bt = _strip(band.map(w => w.s).join(''));
      const hx = {};
      
      for (const k of _COLS) {
        const at = bt.indexOf(_HEAD[k]);
        if (at >= 0) hx[k] = _xOfChar(band, at);
      }
      
      if (hx.name == null) {
        const at = bt.indexOf('用途別科目');
        if (at >= 0) hx.name = _xOfChar(band, at);
      }
      
      if (hx.name == null || hx.amount == null) return null;
      
      const bound = {};
      for (let i = 0; i < _COLS.length - 1; i++) {
        const a = hx[_COLS[i]];
        const b = hx[_COLS[i + 1]];
        if (a != null && b != null) {
          bound[_COLS[i]] = (a + b) / 2;
        }
      }
      
      const headY = Math.min(...band.map(w => w.y));
      const cnt = {};
      for (const w of ws) {
        if (w.y < headY - 2 && w.x > hx.amount && !/^[\d,]/.test(w.s.trim()) && _strip(w.s).length >= 2) {
          cnt[Math.round(w.x)] = (cnt[Math.round(w.x)] || 0) + 1;
        }
      }
      
      const mode = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
      if (mode && mode[1] >= 3) {
        bound.amount = +mode[0] - 2;
      }
      
      const single = {};
      for (const w of ws) {
        if (w.s.trim().length === 1 && w.y < headY - 2) {
          const k = Math.round(w.x);
          single[k] = (single[k] || 0) + 1;
        }
      }
      
      const stacks = Object.entries(single).filter(([, c]) => c >= 5).map(([x]) => +x);
      const ls = stacks.filter(x => x < hx.name);
      const rs = stacks.filter(x => hx.desc != null && x > hx.desc);
      
      return {
        hx,
        bound,
        headY,
        // 偵測不到側標時不可用表頭位置回推左界：續頁欄名只寫「用途別科目」（x=84），
        // 推出的界線 56 會把 x=35 的科目代碼整欄濾掉，該頁科目與明細全數退化成
        //「計畫說明」（實測新北社會局 p165 第一預備金、p331 一般建築及設備）。
        // left 的唯一職責是擋直書側標，沒偵測到側標就沒有要擋的東西。
        left: ls.length ? Math.max(...ls) + 6 : -Infinity,
        right: rs.length ? Math.min(...rs) - 6 : Infinity
      };
    }
    
    function _localLines(ws, head) {
      const { bound, left, headY } = head;
      const colOf = x => {
        for (let i = 0; i < _COLS.length - 1; i++) {
          if (x < bound[_COLS[i]]) return _COLS[i];
        }
        return 'desc';
      };
      
      const out = [];
      for (const r of _groupRows(ws)) {
        if (r.y >= headY - 2) continue;
        const cell = { name: [], unit: [], qty: [], price: [], amount: [], desc: [] };
        
        for (const w of r.ws) {
          if (w.x < left || w.x > head.right) continue;
          const raw = w.s.trim();
          if (/^[0-9a-z][0-9a-z-]{2,8}\s*[-–]\s*\d{1,3}$/i.test(raw)) continue;
          
          const c = colOf(w.x);
          
          if (c === 'amount') {
            const glued = raw.match(/^(-?\d{1,3}(?:,\d{3})+)(0[1-9]|[1-9]\d)([-–].+)$/);
            if (glued) {
              cell.amount.push(glued[1]);
              cell.desc.push(glued[2] + glued[3]);
              continue;
            }
          }
          
          if (c === 'amount' && /^(0[1-9]|[1-9]\d)$/.test(raw) && cell.amount.length > 0) {
            cell.desc.push(raw);
            continue;
          }
          if (c === 'amount' && /^\d{1,2}\./.test(raw)) {
            cell.desc.push(raw);
            continue;
          }
          if (c === 'amount' && /^\d{5,}/.test(raw) && !raw.includes(',')) {
            cell.desc.push(raw);
            continue;
          }
          
          const sp = c === 'amount' && (raw.match(/^([\d,]+)[\s ]+(.+)$/s) || raw.match(/^([\d,]+)([^\d\s,].*)$/s));
          if (sp) {
            cell.amount.push(sp[1]);
            cell.desc.push(sp[2]);
            continue;
          }
          
          cell[c].push(w.s);
        }
        
        const j = a => a.join('').trim();
        if (!cell.unit.length && !cell.qty.length && !cell.price.length && /^[-–]/.test(j(cell.desc))) {
          const fixed = j(cell.amount).match(/^(-?\d{1,3}(?:,\d{3})+)(0[1-9]|[1-9]\d)$/);
          if (fixed) {
            cell.amount = [fixed[1]];
            cell.desc.unshift(fixed[2]);
          }
        }
        
        if (!cell.unit.length && !cell.qty.length && !cell.price.length && /^\d{1,2}$/.test(j(cell.amount)) && /^[.、]/.test(j(cell.desc))) {
          cell.desc.unshift(j(cell.amount));
          cell.amount = [];
        }
        
        const line = { y: r.y };
        for (const k of _COLS) line[k] = j(cell[k]);
        if (_COLS.some(k => line[k])) out.push(line);
      }
      return out;
    }
    
    const _LOCAL_NUM = /^-?[\d,]+$/;
    // 11 碼數字，或統籌支撥的「8970a010401」（第 5 碼為英文字母）。
    // 不接受「10 碼數字＋字尾字母」——那是公文字號（1140761123A）的形狀。
    const _PLAN_CODE = /\b(?:\d{11}|\d{4}[a-z]\d{6})\b/i;
    // 計畫表頭帶：「業務計畫及工作計畫」或「名稱與編號」標籤列上下 16pt 之內。
    function _planHeaderBand(ws, rows, texts) {
      const ys = texts.map((t, i) => /業務計畫及工作計畫|名稱與編號/.test(t) ? rows[i].y : null)
        .filter(y => y !== null);
      return ys.length ? ws.filter(w => ys.some(y => Math.abs(w.y - y) <= 16)) : [];
    }

    function _localRow(plan, br, ln, level) {
      return {
        planCode: plan.code,
        planName: plan.name,
        planBudget: plan.budget,
        branchCode: br ? br.code : '',
        branchName: br ? br.name : '',
        l1Code: '',
        l1Name: '',
        l2Code: '',
        l2Name: '',
        level,
        amount: _LOCAL_NUM.test(ln.amount) ? ln.amount.replace(/,/g, '') : '',
        unit: ln.unit,
        qty: ln.qty,
        price: String(ln.price || '').replace(/,/g, ''),
        desc: ln.desc,
        page: ln.page || '',
        excluded: level === '總經費'
      };
    }
    
    function _isTotalCostText(s) {
      return /(總工程費|總經費)(?:明細)?如下|總工程費\s*[（(]?或[）)]?\s*總經費/.test(_strip(s));
    }
    
    function _attachTotalCostTooltips(rows) {
      let currentCase = null;
      for (const r of rows) {
        if (r.level === '案別') {
          currentCase = r;
          currentCase.totalCostItems = [];
          continue;
        }
        if (r.level === '分支計畫' || r.level === '計畫說明') {
          currentCase = null;
          continue;
        }
        if (r.level !== '總經費' || !currentCase) continue;
        
        const amount = _num(r.amount);
        const text = (r.desc || '').trim();
        const key = `${amount}|${text}`;
        if (!currentCase.totalCostItems.some(x => x.key === key)) {
          currentCase.totalCostItems.push({
            key, amount, text, unit: r.unit || '', qty: r.qty || '', price: _num(r.price)
          });
        }
      }
      
      for (const r of rows) {
        if (!r.totalCostItems?.length) continue;
        const amounts = [...new Set(r.totalCostItems.map(x => x.amount).filter(Boolean))];
        r.totalCostAmount = amounts.length ? Math.max(...amounts) : 0;
        const lines = [];
        if (r.totalCostAmount) {
          lines.push(`全期總工程費／總經費：${_fmt(r.totalCostAmount)}元`);
        }
        
        for (const x of r.totalCostItems) {
          if (!x.unit && !x.qty && !x.price && (!x.text || /總工程費|總經費/.test(x.text))) continue;
          // 說明原文多以句號結尾，直接接「：」會變成「規劃設計費。：29,980,000元」
          const label = (x.text || '總經費組成').replace(/[。，、：；．]+$/, '');
          const value = x.amount || x.price;
          const line = value ? `${label}：${_fmt(value)}元` : label;
          if (!lines.includes(line)) lines.push(line);
        }

    function _repairDetailAmounts(rows) {
      _repairs = [];
      let cur = null, details = [];
      
      const close = () => {
        if (!cur || !details.length) return;
        const target = _num(cur.amount);
        const sum = details.reduce((s, r) => s + _num(r.amount), 0);
        
        if (sum <= target) return;
        
        const candidates = details.map(r => {
          const raw = String(r.amount || '').replace(/^-/, '');
          const a = [_num(r.amount)];
          if (!r.price && raw.length >= 4) {
            for (let k = 1; k <= 3 && k < raw.length - 2; k++) {
              const v = +raw.slice(k);
              if (v >= 0 && v <= target && !a.includes(v)) a.push(v);
            }
          }
          return a;
        });
        
        let solution = null, count = 0;
        
        function dfs(idx, vals, total) {
          if (total > target) return;
          if (idx === details.length) {
            if (total === target) {
              solution = vals.slice();
              count++;
            }
            return;
          }
          for (const v of candidates[idx]) {
            vals.push(v);
            dfs(idx + 1, vals, total + v);
            vals.pop();
            if (count > 1) return;
          }
        }
        
        dfs(0, [], 0);
        
        if (count === 1 && solution) {
          details.forEach((r, i) => {
            const old = _num(r.amount);
            const now = solution[i];
            if (old !== now) {
              _repairs.push({
                page: r.page,
                plan: r.planName,
                branch: r.branchName,
                code: r.l2Code || r.l1Code,
                name: r.l2Name || r.l1Name,
                old,
                new: now,
                desc: r.desc
              });
              r.originalAmount = String(old);
              r.amount = String(now);
              r.repaired = true;
            }
          });
        }
      };
      
      for (const r of rows) {
        if (r.level === '明細') {
          details.push(r);
          continue;
        }
        close();
        details = [];
        cur = (r.level === '用途別一級' || r.level === '用途別二級') ? r : null;
      }
      close();
    }
    
    function reconcile(rows) {

            plan: cur.planName,
            branch: cur.branchName,
            code: cur.l2Code || cur.l1Code,
            name: cur.l2Name || cur.l1Name,
            listed: n(cur.amount),
            sum: acc,
            diff: acc - n(cur.amount),

          cnt++;
          continue;
        }
        close();
        cur = (r.level === '用途別一級' || r.level === '用途別二級') ? r : null;
      }
      close();
      
      const k1 = r => [r.planCode, r.branchCode, r.l1Code].join('|');
      const l1 = new Map();
      for (const r of rows) {
        if (r.level === '用途別一級') {

          if (g) g.a += n(r.amount);
          else l1.set(k1(r), { a: n(r.amount), s: 0, r });

      for (const r of rows) {

          const g = l1.get(k1(r));
          if (g) g.s += n(r.amount);

      for (const g of l1.values()) {

          bad.push({
            type: '二級≠一級',
            plan: g.r.planName,
            branch: g.r.branchName,
            code: g.r.l1Code,
            name: g.r.l1Name,
            listed: g.a,
            sum: g.s,
            diff: g.s - g.a,
            page: g.r.page
          });
        }
      }
      
      const k2 = r => [r.planCode, r.branchCode].join('|');
      const brs = new Map();
      for (const r of rows) {
        if (r.level === '分支計畫') {
          brs.set(k2(r), { a: n(r.amount), s: 0, r });
        }
      }
      
      for (const r of rows) {
        if (r.level === '用途別一級') {
          const g = brs.get(k2(r));
          if (g) g.s += n(r.amount);
        }
      }
      
      for (const g of brs.values()) {
        if (g.s !== g.a) {
          bad.push({
            type: '一級≠分支',
            plan: g.r.planName,
            branch: g.r.branchName,
            code: g.r.branchCode,
            name: g.r.branchName,
            listed: g.a,
            sum: g.s,
            diff: g.s - g.a,
            page: g.r.page
          });
        }
      }
      
      // 沒有分支層的計畫（第一預備金、一般建築及設備、統籌支撥各計畫，實測 18 個）
      // 改比 Σ一級——不能用 `g.s &&` 跳過，那會讓「整頁科目欄被誤濾成計畫說明」
      // 這類錯誤靜默通過（分支數 0 → Σ 0 → 不檢查）。
      const pl = new Map();
      for (const r of rows) {
        if (r.planBudget) {
          pl.set(r.planCode, { a: n(r.planBudget), s: 0, nb: 0, l1: 0, r });
        }
      }
      
      for (const r of rows) {
        const g = pl.get(r.planCode);
        if (!g) continue;
        if (r.level === '分支計畫') { g.s += n(r.amount); g.nb++; }
        else if (r.level === '用途別一級') g.l1 += n(r.amount);
      }
      
      for (const g of pl.values()) {
        if (!g.nb) g.s = g.l1;
        if (g.s !== g.a) {
          bad.push({
            type: g.nb ? '分支≠計畫' : '一級≠計畫',
            plan: g.r.planName,
            branch: '',
            code: g.r.planCode,
            name: g.r.planName,
            listed: g.a,
            sum: g.s,
            diff: g.s - g.a,
            page: g.r.page
          });
        }
      }
      
      return bad;
    }
    
    const _PDFIUM_CDN = 'https://cdn.jsdelivr.net/npm/@embedpdf/pdfium@2.14.4/dist/';
    let _pdfiumLib = null;
    
    async function _loadPdfium() {
      if (_pdfiumLib) return _pdfiumLib;
      const mod = await import(_PDFIUM_CDN + 'index.browser.js');
      _pdfiumLib = await mod.init({ locateFile: f => _PDFIUM_CDN + f });
      _pdfiumLib.PDFiumExt_Init();

    function _pdfiumPageItems(lib, tp) {
      const M = lib.pdfium;
      const n = lib.FPDFText_CountChars(tp);
      const px = M._malloc(8);
      const py = M._malloc(8);
      const chars = [];
      
      for (let i = 0; i < n; i++) {
        const u = lib.FPDFText_GetUnicode(tp, i);
        lib.FPDFText_GetCharOrigin(tp, i, px, py);
        chars.push({
          c: String.fromCharCode(u),
          x: M.HEAPF64[px / 8],
          y: M.HEAPF64[py / 8]
        });
      }
      M._free(px);
      M._free(py);
      
      const rows = [];
      for (const ch of chars) {
        if (ch.c === '\r' || ch.c === '\n') continue;
        let r = rows.find(r0 => Math.abs(r0.y - ch.y) <= 2);
        if (!r) {
          r = { y: ch.y, cs: [] };
          rows.push(r);
        }
        r.cs.push(ch);
      }
      
      const items = [];
      for (const r of rows) {
        r.cs.sort((a, b) => a.x - b.x);
        let run = null;
        for (const ch of r.cs) {
          if (run && ch.x - run.end < 14) {
            run.str += ch.c;
            run.end = ch.x + 11;
          } else {
            run = {
              str: ch.c,
              transform: [0, 0, 0, 0, ch.x, r.y],
              end: ch.x + 11
            };
            items.push(run);
          }
        }
      }
      return items;
    }
    
    function _pdfiumFakeDoc(lib, data) {
      const M = lib.pdfium;
      const ptr = M._malloc(data.length);
      M.HEAPU8.set(data, ptr);
      const doc = lib.FPDF_LoadMemDocument(ptr, data.length, 0);
      if (!doc) {
        M._free(ptr);
        throw Error('PDFium 開檔失敗');
      }
      
      return {
        numPages: lib.FPDF_GetPageCount(doc),
        async getPage(no) {
          return {
            async getTextContent() {
              const page = lib.FPDF_LoadPage(doc, no - 1);
              const tp = lib.FPDFText_LoadPage(page);
              const items = _pdfiumPageItems(lib, tp);
              lib.FPDFText_ClosePage(tp);
              lib.FPDF_ClosePage(page);
              return { items };
            }
          };
        },
        destroy() {
          lib.FPDF_CloseDocument(doc);
          M._free(ptr);
        }
      };
    }

        _tipEl.textContent = text;
        _tipEl.style.display = 'block';
        // 先顯示再量尺寸，才能貼著游標又不超出視窗
        const r = _tipEl.getBoundingClientRect();
        _tipEl.style.left = Math.max(6, Math.min(x + 14, innerWidth - r.width - 6)) + 'px';
        _tipEl.style.top = (y + r.height + 20 > innerHeight ? y - r.height - 12 : y + 18) + 'px';
      };
      document.addEventListener('mouseover', e => {
        const el = e.target.closest?.('[data-tip]');
        if (el) _tipShow(el.getAttribute('data-tip'), e.clientX, e.clientY);
      });
      document.addEventListener('mousemove', e => {
        if (_tipEl && _tipEl.style.display === 'block' && e.target.closest?.('[data-tip]')) {
          _tipShow(_tipEl.textContent, e.clientX, e.clientY);
        }
      });
      document.addEventListener('mouseout', e => {
        if (_tipEl && !e.relatedTarget?.closest?.('[data-tip]')) _tipEl.style.display = 'none';
      });
      addEventListener('scroll', () => { if (_tipEl) _tipEl.style.display = 'none'; }, true);
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    
    function render() {
      _issues = reconcile(_rows);
      const cls = {
        '計畫說明': 'lv-plan',
        '案別': 'lv-case',
        '分支計畫': 'lv-branch',
        '用途別一級': 'lv-l1',
        '用途別二級': 'lv-l2',
        '明細': 'lv-detail'
      };
      
      let reconLine;
      if (_issues.length) {
        const lines = _issues.map(x => `${esc(x.type)}｜${esc(x.plan)}｜${esc(x.branch)}｜${esc(x.code)} ${esc(x.name)}：表列 ${_fmt(x.listed)}；加總 ${_fmt(x.sum)}；差異 ${_fmt(x.diff)}${x.page ? '；PDF第 ' + x.page + ' 頁' : ''}`).join('<br>');
        reconLine = `<div class="recon bad">⚠ 四層加總驗算有 ${_issues.length} 處不符：<br>${lines}</div>`;
      } else {
        reconLine = '<p class="ok">✅ 四層加總驗算全數通過（明細→科目→分支→工作計畫）</p>';
      }
      
      if (_repairs.length) {
        reconLine += `<p class="note">ℹ 已自動修復 ${_repairs.length} 筆疑似欄位黏連金額；匯出資料會保留「原始預算數」供複核。</p>`;
      }
      
      const getOpts = (l, pick, vf, tf) => {
        const m = new Map();
        for (const r of _rows.filter(r => r.level !== '總經費' && _passUpTo(r, l))) {
          if (pick(r) && !m.has(vf(r))) m.set(vf(r), tf(r));
        }
        const opts = [...m].map(([v, t]) => ({ v, t }));
        if (_filter[l] && !opts.some(o => o.v === _filter[l])) _filter[l] = '';
        return opts;
      };
      
      const planOpts = getOpts('plan', r => r.planCode, r => r.planCode, r => `${r.planCode} ${r.planName}`);
      const brOpts = getOpts('branch', r => r.branchCode && r.branchName, r => r.branchName, r => r.branchName);
      const acctOpts = getOpts('acct', r => r.l1Code || r.l2Code, r => r.l2Code || r.l1Code, r => `${r.l2Code || r.l1Code} ${r.l2Name || r.l1Name}`);
      const levelOpts = getOpts('level', r => r.level, r => r.level, r => r.level);
      const F = _filter;
      
      const sel = (k, label, opts, cur) => `
        <label>${label}：
          <select onchange="_onFilter('${k}', this.value)">
            <option value="">全部</option>
            ${opts.map(o => `<option value="${esc(o.v)}"${o.v === cur ? ' selected' : ''}>${esc(o.t)}</option>`).join('')}
          </select>
        </label>`;
        
      const search = `<label>說明搜尋：<input value="${esc(F.q)}" placeholder="輸入關鍵字後按 Enter" oninput="_filter.q=this.value" onkeydown="if(event.key==='Enter')render()"></label>`;
      const clear = (F.plan || F.branch || F.acct || F.level || F.q) ? `<button class="btn-sec" onclick="_filter.plan=_filter.branch=_filter.acct=_filter.level=_filter.q='';render()" style="padding:5px 12px">清除</button>` : '';
      
      const filter = `<div class="filter-bar">${sel('plan', '工作計畫', planOpts, F.plan)}${sel('branch', '分支計畫', brOpts, F.branch)}${sel('acct', '用途別科目', acctOpts, F.acct)}${sel('level', '層級', levelOpts, F.level)}${search}${clear}</div>`;
      const view = _rows.filter(r => r.level !== '總經費' && _pass(r));
      const leaves = view.filter(r => r.level === '明細' && !r.excluded);
      const total = leaves.reduce((s, r) => s + _num(r.amount), 0);
      
      const totalRow = `<tr class="lv-total">
        <td colspan="9">合計（目前篩選：${leaves.length}筆本年度明細；總經費列不計）</td>
        <td class="num">${_fmt(total)}</td>
        <td></td>
      </tr>`;
      
      const body = view.map(r => `
        <tr class="${cls[r.level] || ''}">
          <td>${esc(r.planCode)}</td>
          <td>${esc(r.planName)}</td>
          <td>${esc(r.branchCode)}</td>
          <td>${esc(r.branchName)}</td>
          <td>${esc(r.l2Code || r.l1Code)}</td>
          <td>${esc(r.l2Name || r.l1Name)}</td>
          <td>${esc(r.unit)}</td>
          <td class="num">${esc(r.qty)}</td>
          <td class="num">${_fmt(r.price)}</td>
          <td class="num ${r.totalCostTooltip ? 'has-total-cost' : ''}"${r.totalCostTooltip || r.repaired ? ` data-tip="${esc(r.repaired ? '原始擷取：' + _fmt(r.originalAmount) : r.totalCostTooltip)}"` : ''}>
            ${_fmt(r.amount)}${r.repaired ? ' *' : ''}
            ${r.totalCostTooltip ? '<span class="total-tip">ⓘ</span>' : ''}
          </td>
          <td>${esc(r.desc)}</td>
        </tr>
      `).join('');
      
      document.getElementById('out').innerHTML = reconLine + filter + `
        <div class="tw">
          <table>
            <thead>
              <tr>
                <th>工作計畫編號</th>
                <th>工作計畫</th>
                <th>分支計畫編號</th>
                <th>分支計畫</th>
                <th>用途別科目代碼</th>
                <th>用途別科目</th>
                <th>單位</th>
                <th>數量</th>
                <th>單價</th>
                <th>預算數</th>
                <th>說明</th>
              </tr>
            </thead>
            <tbody>
              ${totalRow}
              ${body}
            </tbody>
          </table>
        </div>`;
        
      const tbl = document.querySelector('.tw table');
      if (tbl && tbl.tHead) {
        tbl.style.setProperty('--head-h', tbl.tHead.getBoundingClientRect().height + 'px');
      }
    }
    
    function _exportRows() {
      return _rows.filter(r => r.level !== '總經費' && _pass(r));
    }
    
    function exportData(kind) {
      if (!_rows.length) return;
      
      const head = ['工作計畫編號', '工作計畫', '分支計畫編號', '分支計畫', '用途別科目代碼', '用途別科目', '層級', '單位', '數量', '單價', '預算數', '原始預算數', '自動修復', '全期總經費', '總經費說明', 'PDF頁碼', '說明'];
      const view = _exportRows();
      const arr = r => [r.planCode, r.planName, r.branchCode, r.branchName, r.l2Code || r.l1Code, r.l2Name || r.l1Name, r.level, r.unit, r.qty, r.price, r.amount === '' ? '' : +r.amount, r.originalAmount ? +r.originalAmount : '', r.repaired ? '是' : '', r.totalCostAmount || '', r.totalCostTooltip || '', r.page, r.desc];
      const fname = '歲出計畫說明提要與各項費用明細表';
      
      if (kind === 'xlsx') {
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head, ...view.map(arr)]), '費用明細表');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(_issues), '驗算差異');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(_repairs), '自動修復');
        XLSX.writeFile(wb, fname + '.xlsx');
        return;
      }
      
      let content, mime;
      if (kind === 'csv') {
        const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
        content = '\ufeff' + [head, ...view.map(arr)].map(r => r.map(q).join(',')).join('\r\n');
        mime = 'text/csv;charset=utf-8';
      } else {
        content = JSON.stringify(view.map(r => Object.fromEntries(head.map((h, i) => [h, arr(r)[i]]))), null, 2);
        mime = 'application/json';
      }
      download(content, fname + '.' + kind, mime);
    }
    
    function exportIssues() {
      const head = ['類型', '工作計畫', '分支計畫', '代碼', '名稱', '表列數', '明細加總', '差異', 'PDF頁碼'];
      const arr = x => [x.type, x.plan, x.branch, x.code, x.name, x.listed, x.sum, x.diff, x.page];
      const wb = XLSX.utils.book_new();
      
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head, ..._issues.map(arr)]), '驗算差異');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(_repairs), '自動修復');
      XLSX.writeFile(wb, '歲出解析驗算差異.xlsx');
    }
    
    function download(content, name, type) {
      const a = document.createElement('a');
      const url = URL.createObjectURL(new Blob([content], { type }));
      a.href = url;
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  </script>
</body>
</html>
